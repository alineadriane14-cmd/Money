  if (metas.length === 0) {
    html += '<div class="cartao-empty">' +
      '<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 5c-1.5-1.5-3-2-5.5-2A6.5 6.5 0 0 0 7 9.5c0 3 1.5 4.5 3 6l.5 5.5h4L15 17c2-1 4-3 4-6"/><circle cx="16" cy="8" r="1"/></svg>' +
      '<p>Nenhuma meta cadastrada ainda.</p>' +
      '<div class="metas-empty-actions">' +
      '<button type="button" class="btn-primary btn-sm" data-action="metaAddStart" data-value="reserva"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><polyline points="9 12 11 14 15 10"/></svg> Reserva de emergência</button>' +
      '<button type="button" class="btn-ghost btn-sm" data-action="metaAddStart" data-value="1"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Outra meta</button>' +
      '</div></div>';
  } else {
    html += '<div class="metas-add-row"><button type="button" class="btn-ghost btn-sm" data-action="metaAddStart" data-value="1">' +
      '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Nova meta</button></div>';
  }

  var hasReserva = metas.some(function (m) { return m.tipo === "reserva"; });
  var suggested = computeSuggestedReserve(store.transactions);
  if (!hasReserva && suggested) {
    html += '<div class="cartao-compromisso">Com base no seu histórico, uma reserva de emergência de 6 meses de despesas ficaria em torno de ' + formatCurrency(suggested) + '. ' +
      '<button type="button" class="link-btn" data-action="metaAddStart" data-value="reserva">Criar reserva</button></div>';
  }

  html += '<div class="metas-list">' + metas.map(metaCardHTML).join("") + '</div>';
  container.innerHTML = html;
}

/* ----------------------------- view: negociações ------------------------------ */

function negFormHTML() {
  return (
    '<div class="inline-form">' +
      '<div class="inline-form-title">Nova negociação</div>' +
      '<label>Nome / credor<input id="nf-nome" placeholder="Ex: Negociação Nubank" autofocus></label>' +
      '<label>Valor total negociado<input id="nf-valor" placeholder="R$" inputmode="decimal"></label>' +
      '<label>Nº de parcelas<input id="nf-parcelas" placeholder="Ex: 6" inputmode="numeric" maxlength="2"></label>' +
      '<div class="inline-form-actions">' +
        '<button type="button" class="btn-ghost" data-action="negCancel">Cancelar</button>' +
        '<button type="button" class="btn-primary" data-action="negSave">Salvar negociação</button>' +
      '</div>' +
    '</div>'
  );
}

function negCardHTML(neg) {
  var n = neg.parcelas || 1;
  var pagas = Math.min(neg.parcelasPagas || 0, n);
  var saldo = negociacaoSaldoDevedor(neg);
  var quitada = pagas >= n;
  var proxima = negociacaoProximaParcela(neg);
  var pct = n > 0 ? Math.min(100, (pagas / n) * 100) : 0;
  var confirming = uiState.deletingNegId === neg.id;
  var headRight = confirming
    ? '<div class="lanc-delete-confirm"><button type="button" class="btn-ghost btn-xs" data-action="negDeleteCancel">Cancelar</button><button type="button" class="btn-danger btn-xs" data-action="negDeleteConfirm" data-id="' + neg.id + '">Excluir</button></div>'
    : '<button type="button" class="lanc-delete-btn" aria-label="Excluir negociação" data-action="negDeleteAsk" data-id="' + neg.id + '"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>';
  var actionHTML = quitada
    ? '<div class="fatura-status fatura-status-paga"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><polyline points="9 12 11 14 15 10"/></svg> Negociação quitada</div>'
    : '<div class="meta-aporte-row"><button type="button" class="btn-primary btn-sm meta-aportar-btn" data-action="negPagarParcela" data-id="' + neg.id + '">Pagar parcela de ' + formatCurrency(proxima) + '</button>' +
      (pagas > 0 ? '<button type="button" class="link-btn" data-action="negDesfazer" data-id="' + neg.id + '">Desfazer última</button>' : '') +
      '</div>';

  return (
    '<div class="meta-card">' +
      '<div class="meta-card-head"><span class="meta-card-name"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="21" x2="21" y2="21"/><line x1="4" y1="10" x2="20" y2="10"/><polygon points="12 3 20 10 4 10 12 3"/><line x1="6" y1="10" x2="6" y2="21"/><line x1="18" y1="10" x2="18" y2="21"/></svg> ' + escapeHTML(neg.nome) + '</span>' + headRight + '</div>' +
      '<div class="meta-card-values">' + formatCurrency(saldo) + '<span class="meta-card-target"> restantes de ' + formatCurrency(neg.valorTotal) + '</span></div>' +
      '<div class="balance-bar"><div class="balance-bar-fill fill-teal" style="width:' + pct + '%"></div></div>' +
      '<div class="meta-card-sub">' + pagas + '/' + n + ' parcelas pagas</div>' +
      actionHTML +
    '</div>'
  );
}

function renderNegociacoes() {
  var container = document.getElementById("negView");
  var negociacoes = store.negociacoes || [];

  if (uiState.addingNeg) {
    container.innerHTML = negFormHTML();
    return;
  }

  var html = "";
  if (negociacoes.length === 0) {
    html += '<div class="cartao-empty"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="21" x2="21" y2="21"/><line x1="4" y1="10" x2="20" y2="10"/><polygon points="12 3 20 10 4 10 12 3"/><line x1="6" y1="10" x2="6" y2="21"/><line x1="18" y1="10" x2="18" y2="21"/></svg>' +
      '<p>Nenhuma negociação cadastrada ainda.</p>' +
      '<button type="button" class="btn-primary btn-sm" data-action="negAddStart"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Nova negociação</button></div>';
  } else {
    html += '<div class="metas-add-row"><button type="button" class="btn-ghost btn-sm" data-action="negAddStart"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Nova negociação</button></div>';
  }

  html += '<div class="metas-list">' + negociacoes.map(negCardHTML).join("") + '</div>';
  container.innerHTML = html;
}

/* --------------------------------- eventos --------------------------------- */

document.getElementById("btnSend").addEventListener("click", handleSubmit);
document.getElementById("chatInput").addEventListener("keydown", function (e) {
  if (e.key === "Enter") handleSubmit();
});
document.getElementById("btnSummary").addEventListener("click", function () {
  var panel = document.getElementById("summaryPanel");
  panel.hidden = !panel.hidden;
});
document.getElementById("btnExportData").addEventListener("click", handleExportData);
document.getElementById("btnImportData").addEventListener("click", function () {
  document.getElementById("importFileInput").click();
});
document.getElementById("importFileInput").addEventListener("change", function (e) {
  var file = e.target.files && e.target.files[0];
  handleImportFile(file);
  e.target.value = "";
});

document.querySelectorAll(".tab-btn").forEach(function (btn) {
  btn.addEventListener("click", function () {
    document.querySelectorAll(".tab-btn").forEach(function (b) { b.classList.remove("tab-active"); });
    btn.classList.add("tab-active");
    document.querySelectorAll(".view").forEach(function (v) { v.hidden = true; });
    document.getElementById("view-" + btn.dataset.tab).hidden = false;
  });
});

document.getElementById("chatScroll").addEventListener("click", function (e) {
  var el = e.target.closest("[data-action]");
  if (!el) return;
  var action = el.dataset.action;
  var draftId = el.dataset.draft;
  if (action === "pickPayment") draftActions.pickPayment(draftId, el.dataset.payment);
  else if (action === "pickCard") draftActions.pickCard(draftId, el.dataset.card);
  else if (action === "newCardFrom") draftActions.newCardFrom(draftId);
  else if (action === "toggleClass") draftActions.toggleClass(draftId, el.dataset.value);
  else if (action === "cancelDraft") draftActions.cancel(draftId);
  else if (action === "confirmDraft") draftActions.confirm(draftId);
  else if (action === "saveCard") {
    var pfx = "cf-" + draftId + "-";
    var vals = {
      name: document.getElementById(pfx + "name").value,
      closingDay: document.getElementById(pfx + "closing").value,
      dueDay: document.getElementById(pfx + "due").value,
      limit: document.getElementById(pfx + "limit").value,
    };
    if (!vals.name.trim()) return;
    draftActions.registerCard(draftId, vals);
  }
});

/* -------- lançamentos -------- */

document.getElementById("lancView").addEventListener("click", function (e) {
  var el = e.target.closest("[data-action]");
  if (!el) return;
  var action = el.dataset.action;
  var id = el.dataset.id;
  if (action === "filtroTipo") { uiState.filtros.tipo = el.dataset.value; render(); }
  else if (action === "filtroPeriodo") { uiState.filtros.periodo = uiState.filtros.periodo === "mes" ? "todos" : "mes"; render(); }
  else if (action === "filtroClass") { uiState.filtros.classificacao = el.dataset.value; render(); }
  else if (action === "startEditTx") {
    var t = store.transactions.find(function (x) { return x.id === id; });
    if (!t) return;
    var tags = ["necessidade", "desejo"].concat(store.classTags || []);
    uiState.editingTxId = id;
    uiState.editClass = tags.indexOf(t.classificacao) !== -1 ? t.classificacao : null;
    render();
  }
  else if (action === "cancelEditTx") { uiState.editingTxId = null; render(); }
  else if (action === "editTogglePill") {
    uiState.editClass = uiState.editClass === el.dataset.value ? null : el.dataset.value;
    render();
  }
  else if (action === "saveEditTx") {
    var t2 = store.transactions.find(function (x) { return x.id === id; });
    if (!t2) return;
    var catInput = document.getElementById("editCategoriaInput");
    var dataInput = document.getElementById("editDataInput");
    var categoriaVal = catInput.value.trim();
    var categoria = categoriaVal ? categoriaVal.charAt(0).toUpperCase() + categoriaVal.slice(1) : t2.categoria;
    var data = t2.data;
    if (dataInput.value) {
      var d = new Date(dataInput.value + "T12:00:00");
      if (!isNaN(d)) data = d.toISOString();
    }
    uiState.editingTxId = null;
    handleEditTransaction(id, {
      categoria: categoria,
      classificacao: t2.tipo === "despesa" ? (uiState.editClass || "Não classificado") : t2.classificacao,
      data: data,
    });
  }
  else if (action === "askDeleteTx") { uiState.deletingTxId = id; render(); }
  else if (action === "cancelDeleteTx") { uiState.deletingTxId = null; render(); }
  else if (action === "confirmDeleteTx") { uiState.deletingTxId = null; handleDeleteTransaction(id); }
});

document.getElementById("lancView").addEventListener("change", function (e) {
  if (e.target && e.target.id === "filtroPagamentoSelect") {
    uiState.filtros.pagamento = e.target.value;
    render();
  }
});

/* -------- cartão -------- */

document.getElementById("cartaoView").addEventListener("click", function (e) {
  var el = e.target.closest("[data-action]");
  if (!el) return;
  var action = el.dataset.action;
  if (action === "addCardStart") { uiState.addingCard = true; render(); }
  else if (action === "cartaoCancelCard") { uiState.addingCard = false; render(); }
  else if (action === "cartaoSaveCard") {
    var vals = {
      name: document.getElementById("ccf-name").value,
      closingDay: document.getElementById("ccf-closing").value,
      dueDay: document.getElementById("ccf-due").value,
      limit: document.getElementById("ccf-limit").value,
    };
    if (!vals.name.trim()) return;
    uiState.addingCard = false;
    handleRegisterCardDirect(vals);
  }
  else if (action === "selectCard") { uiState.selectedCardId = el.dataset.card; render(); }
  else if (action === "unmarkFaturaPaga") handleUnmarkFaturaPaga(el.dataset.id);
  else if (action === "markFaturaPaga") handleMarkFaturaPaga(el.dataset.card, el.dataset.mesano);
  else if (action === "deleteCardAsk") { uiState.deletingCardId = el.dataset.card; render(); }
  else if (action === "deleteCardCancel") { uiState.deletingCardId = null; render(); }
  else if (action === "deleteCardConfirm") { uiState.deletingCardId = null; handleDeleteCard(el.dataset.card); }
});

/* -------- categorias -------- */

document.getElementById("catView").addEventListener("click", function (e) {
  var el = e.target.closest("[data-action]");
  if (el) {
    var action = el.dataset.action;
    if (action === "catPeriodo") { uiState.periodoCategorias = el.dataset.value; render(); }
    else if (action === "removeTag") handleRemoveClassTag(el.dataset.value);
  }
  if (e.target && e.target.id === "btnAddTag") {
    var input = document.getElementById("novaTagInput");
    var val = input.value.trim();
    if (val) handleAddClassTag(val);
  }
});
document.getElementById("catView").addEventListener("keydown", function (e) {
  if (e.target && e.target.id === "novaTagInput" && e.key === "Enter") {
    var val = e.target.value.trim();
    if (val) handleAddClassTag(val);
  }
});

/* -------- metas -------- */

document.getElementById("metasView").addEventListener("click", function (e) {
  var el = e.target.closest("[data-action]");
  if (!el) return;
  var action = el.dataset.action;
  var id = el.dataset.id;
  if (action === "metaAddStart") { uiState.addingMeta = el.dataset.value === "reserva" ? "reserva" : true; render(); }
  else if (action === "metaCancel") { uiState.addingMeta = false; render(); }
  else if (action === "metaSave") {
    var vals = {
      nome: document.getElementById("mf-nome").value,
      valorAlvo: document.getElementById("mf-valor").value,
      prazo: document.getElementById("mf-prazo").value,
      tipo: uiState.addingMeta === "reserva" ? "reserva" : (document.getElementById("mf-reserva") && document.getElementById("mf-reserva").checked ? "reserva" : "normal"),
    };
    if (!vals.nome.trim() || !vals.valorAlvo) return;
    uiState.addingMeta = false;
    handleAddMeta(vals);
  }
  else if (action === "metaDeleteAsk") { uiState.deletingMetaId = id; render(); }
  else if (action === "metaDeleteCancel") { uiState.deletingMetaId = null; render(); }
  else if (action === "metaDeleteConfirm") { uiState.deletingMetaId = null; handleDeleteMeta(id); }
  else if (action === "aporteStart") { uiState.aportingId = id; uiState.aporteValor = ""; render(); }
  else if (action === "aporteCancel") { uiState.aportingId = null; uiState.aporteValor = ""; render(); }
  else if (action === "aporteSave") {
    var input = document.getElementById("aporteInput-" + id);
    var valor = input ? input.value : uiState.aporteValor;
    if (!valor) return;
    uiState.aportingId = null;
    uiState.aporteValor = "";
    handleAportar(id, valor);
  }
});
document.getElementById("metasView").addEventListener("input", function (e) {
  if (e.target && e.target.id && e.target.id.indexOf("aporteInput-") === 0) {
    uiState.aporteValor = e.target.value.replace(/[^\d.,]/g, "");
  }
});

/* -------- negociações -------- */

document.getElementById("negView").addEventListener("click", function (e) {
  var el = e.target.closest("[data-action]");
  if (!el) return;
  var action = el.dataset.action;
  var id = el.dataset.id;
  if (action === "negAddStart") { uiState.addingNeg = true; render(); }
  else if (action === "negCancel") { uiState.addingNeg = false; render(); }
  else if (action === "negSave") {
    var vals = {
      nome: document.getElementById("nf-nome").value,
      valorTotal: document.getElementById("nf-valor").value,
      parcelas: document.getElementById("nf-parcelas").value,
    };
    if (!vals.nome.trim() || !vals.valorTotal || !vals.parcelas) return;
    uiState.addingNeg = false;
    handleAddNegociacao(vals);
  }
  else if (action === "negDeleteAsk") { uiState.deletingNegId = id; render(); }
  else if (action === "negDeleteCancel") { uiState.deletingNegId = null; render(); }
  else if (action === "negDeleteConfirm") { uiState.deletingNegId = null; handleDeleteNegociacao(id); }
  else if (action === "negPagarParcela") handlePagarParcelaNegociacao(id);
  else if (action === "negDesfazer") handleDesfazerParcelaNegociacao(id);
});

render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
